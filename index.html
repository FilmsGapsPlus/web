<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmsGapsPlus | Ver Películas, Series y TV Online en Vivo sin Anuncios</title>
    <link rel="icon" href="img/icon_filmsgapsplus.png" type="image/png">
    <link rel="apple-touch-icon" href="img/icon_filmsgapsplus.png">
    <meta name="description" content="Ver películas, series y canales de TV online en vivo sin anuncios. FilmsGapsPlus ofrece streaming rápido, estable y optimizado para móvil, PC y Smart TV, sin registros innecesarios.">
    <meta name="author" content="FilmsGapsPlus">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://filmsgapsplus.github.io/web">
    <meta name="theme-color" content="#050506">

    <!-- Open Graph (Facebook, WhatsApp, Telegram) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FilmsGapsPlus">
    <meta property="og:locale" content="es_LA">
    <meta property="og:title" content="FilmsGapsPlus | Películas, Series y TV Online sin Anuncios">
    <meta property="og:description" content="Streaming de películas, series y TV online en vivo sin anuncios. Rápido, seguro y sin interrupciones.">
    <meta property="og:url" content="https://filmsgapsplus.github.io/web">
    <meta property="og:image" content="https://filmsgapsplus.github.io/web/img/icon_filmsgapsplus.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FilmsGapsPlus | Streaming sin Anuncios">
    <meta name="twitter:description" content="Películas, series y TV online en vivo sin anuncios. Disfruta streaming estable y sin interrupciones.">
    <meta name="twitter:image" content="https://filmsgapsplus.github.io/web/img/icon_filmsgapsplus.png">

    <!-- PWA / Apple -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FilmsGapsPlus">

    <!-- Descarga -->
    <meta name="download_url" content="https://filmsgapsplus.github.io/home">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css?v=20260823">
</head>
<body>
    <header id="site-header">
        <a class="logo" href="/">FilmsGaps <span>Plus</span></a>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar películas o series...">
            <button id="search-btn" aria-label="Buscar">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Cargando contenido...</span>
    </div>
    <main>
        <div class="hero-section" id="hero-section" style="display:none;"></div>
        <div class="nav-tabs" id="tabs" style="display:none;">
            <div class="nav-tab" data-content="channels">
                <i class="fas fa-satellite-dish"></i> Canales
            </div>
            <div class="nav-tab active" data-content="movies">
                <i class="fas fa-film"></i> Películas
            </div>
            <div class="nav-tab" data-content="series">
                <i class="fas fa-tv"></i> Series
            </div>
        </div>
        <div id="content-container"></div>
    </main>

    <!-- Reproductor fullscreen de canales en vivo (@videojs/html) -->
    <div class="channel-player-container" id="channel-player-container">
        <button class="channel-player-close" id="channel-player-close" aria-label="Cerrar reproductor">
            <i class="fas fa-times"></i>
        </button>
        <div class="channel-video-stage">
            <video-player id="channel-vjs-player" class="channel-video-player">
                <video-minimal-skin>
                    <video id="channel-video" playsinline></video>
                </video-minimal-skin>
            </video-player>
            <div class="channel-video-loading" id="channel-video-loading">
                <div class="spinner"></div>
                <span>Cargando canal...</span>
            </div>
            <div class="channel-video-error" id="channel-video-error" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <span>No se pudo cargar la transmisión</span>
                <button class="btn btn-primary" id="channel-retry-btn">
                    <i class="fas fa-redo"></i> Reintentar
                </button>
            </div>
        </div>
    </div>

    <div id="footer-root"></div>

    <!-- Modal de géneros -->
    <div class="modal" id="genres-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fas fa-shapes"></i> Géneros disponibles</h2>
                <button class="modal-close" id="genres-modal-close" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="genres-grid"></div>
            </div>
        </div>
    </div>
    <!-- Modal de selección de países para canales -->
    <div class="modal" id="countries-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fas fa-globe"></i> Selecciona un país</h2>
                <button class="modal-close" id="countries-modal-close" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="countries-search-container">
                    <input type="text" id="countries-search" class="countries-search-input" placeholder="Buscar país...">
                    <i class="fas fa-search countries-search-icon"></i>
                </div>
                <div class="countries-grid-modal" id="countries-grid-modal"></div>
            </div>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>
    <script src="js/url-utils.js"></script>
    <script src="js/history.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
